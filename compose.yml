services:
  piper-tts:
    # image: 9109679196/piper-tts-rest-api:2.1.0
    # environment:
    #   LOGGING_MODE: "JSON"
    build: .
    user: "1000:1000"
    ports:
      - "3000:$PORT"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3000}/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      otel-healthcheck:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_PLUGINS: rabbitmq_prometheus
    ports:
      - 5672:5672
      - 15672:15672
      - 15692:15692 # Prometheus metrics endpoint
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./local-setup/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - 4318:4318 # OTLP HTTP -- apps point OTEL_EXPORTER_OTLP_ENDPOINT to this port
      - 4317:4317 # OTLP gRPC -- Apps push traces via gRPC to this port

  # One-shot sidecar that blocks `piper-tts` until the collector's health_check extension is serving 200 OK. The collector image itself is distroless (no shell, no wget/curl), so an in-container `healthcheck:` cannot be used -- hence this separate busybox container.
  otel-healthcheck:
    image: busybox:1.37
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - sh
      - -eu
      - -c
      - |
        for i in $$(seq 1 60); do
          if wget -S -qO- --timeout=3 http://otel-collector:13133/ 2>&1; then
            echo "otel-collector is healthy after $$i attempt(s)"
            exit 0
          fi
          echo "[$$i/60] otel-collector not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "ERROR: otel-collector did not become healthy within 120s" >&2
        exit 1

  tempo:
    image: grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./local-setup/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.6.2
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./local-setup/loki.yaml:/etc/loki.yaml:ro

  prometheus:
    image: prom/prometheus:v3.14.0-busybox
    volumes:
      - ./local-setup/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:12.4.3
    depends_on:
      - tempo
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_DATA: /tmp/grafana
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./local-setup/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - 3001:3000
